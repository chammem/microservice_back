# Database Configuration (Docker ? Local MySQL)
# Database Configuration (MUST include ALL these)
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/deliverymicroservice?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration (CRITICAL)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true




#Server configuration
server.port=8093
server.servlet.context-path=

# Eureka Client Registration

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true


# Enable basic authentication (simple, in-memory authentication)
spring.security.user.name=admin
spring.security.user.password=admin123


