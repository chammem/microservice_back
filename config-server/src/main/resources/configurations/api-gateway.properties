# Configuration de base
spring.application.name=api-gateway
server.port=8222

# Eureka Config
eureka.instance.hostname=api-gateway
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka

# Gateway Dynamic Routing
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Routes statiques (fallback)
spring.cloud.gateway.routes[0].id=cart
spring.cloud.gateway.routes[0].uri=http://cart-service:8080
spring.cloud.gateway.routes[0].predicates=Path=/api/cart/**

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always